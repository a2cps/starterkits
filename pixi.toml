#:schema https://pixi.sh/v0.73.0/schema/manifest/schema.json

[workspace]
authors = [ "Patrick Sadil <psadil@gmail.com>" ]
channels = [ "conda-forge" ]
name = "starterkits"
platforms = [ "linux-64", "osx-arm64" ]
version = "0.1.0"
# Required for the source dependencies under vendor/, which build R packages that
# conda-forge does not publish.
preview = [ "pixi-build" ]

[tasks]
preview = "export QUARTO_PYTHON=$CONDA_PREFIX/bin/python && quarto preview"
render = "export QUARTO_PYTHON=$CONDA_PREFIX/bin/python && quarto render"

[dependencies]
air = ">=0.11.0,<0.12"
codespell = ">=2.4.3,<3"
panache = ">=3.0.2,<4"
prek = ">=0.4.11,<0.5"
quarto = ">=1.9.38,<2"
r = ">=4.5,<4.6"
r-agree = {git = "https://github.com/psadil/agree", branch = "main"}
r-arrow = ">=24.0.0,<25"
r-complexupset = ">=1.3.3,<2"
r-dplyr = ">=1.2.1,<2"
r-dt = ">=0.34.0,<0.35"
r-duckplyr = ">=1.2.1,<2"
r-fs = ">=2.1.0,<3"
r-ggally = ">=2.4.0,<3"
r-ggdist = "*"
r-ggplot2 = ">=4.0.3,<5"
r-glue = ">=1.8.1,<2"
r-gt = ">=1.3.0,<2"
r-hablar = {path = "vendor/r-hablar"}
r-here = ">=1.0.2,<2"
r-irr = ">=0.85,<0.86"
r-janitor = ">=2.2.1,<3"
r-jsonlite = ">=2.0.0,<3"
r-knitr = ">=1.51,<2"
r-lme4 = ">=2.0_6,<3"
r-mgc = ">=2.0.2,<3"
r-naniar = ">=1.1.0,<2"
r-nio = {git = "https://github.com/psadil/nio", branch = "main"}
r-patchwork = ">=1.3.2,<2"
r-png = ">=0.1_9,<0.2"
r-purrr = ">=1.2.2,<2"
r-readr = ">=2.2.0,<3"
r-reticulate = ">=1.46.0,<2"
r-rmarkdown = ">=2.31,<3"
r-rnifti = ">=1.9.0,<2"
r-roll = {path = "vendor/r-roll"}
r-scattermore = ">=1.2,<2"
r-stringr = ">=1.6.0,<2"
r-tibble = ">=3.3.1,<4"
r-tidyr = ">=1.3.2,<2"
r-tidyselect = ">=1.2.1,<2"
r-tidyverse = ">=2.0.0,<3"
r-yaml = ">=2.3.12,<3"
