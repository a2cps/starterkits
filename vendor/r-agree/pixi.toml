# agree declares its own pixi package, but it imports ggdist, which conda-forge
# has never built for osx-arm64. This wrapper exists only to point that import at
# the source build in ../r-ggdist. Once the feedstock ships an osx-arm64 build,
# this directory can be deleted and agree consumed directly, as nio is.
[package]
name = "r-agree"
version = "0.0.0.9000"

[package.build.backend]
channels = [ "conda-forge", "https://prefix.dev/pixi-build-backends" ]
name = "pixi-build-r"
version = "*"

[package.build.source]
branch = "main"
git = "https://github.com/psadil/agree"

[package.host-dependencies]
r-base = ">=4.5,<4.6"
r-dplyr = "*"
r-ggdist = {path = "../r-ggdist"}
r-ggplot2 = "*"
r-rlang = "*"
r-tibble = "*"

[package.run-dependencies]
r-dplyr = "*"
r-ggdist = {path = "../r-ggdist"}
r-ggplot2 = "*"
r-rlang = "*"
r-tibble = "*"
