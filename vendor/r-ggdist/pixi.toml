# ggdist is not installable from conda-forge, so it is built from source.
# Referenced from the workspace manifest; see the note in ../../pixi.toml.
[package]
name = "r-ggdist"
version = "3.3.3"

[package.build.backend]
name = "pixi-build-r"
version = "*"
channels = ["https://prefix.dev/pixi-build-backends", "conda-forge"]

[package.build.source]
git = "https://github.com/cran/ggdist"
tag = "3.3.3"

# Dependencies are listed in full: naming any of them replaces what the backend
# would otherwise infer from DESCRIPTION. r-base is pinned because the backend
# otherwise resolves against the newest R, which the workspace does not use.
[package.host-dependencies]
r-base = ">=4.5,<4.6"
r-rcpp = "*"
r-cli = "*"
r-distributional = "*"
r-ggplot2 = "*"
r-glue = "*"
r-gtable = "*"
r-numderiv = "*"
r-quadprog = "*"
r-rlang = "*"
r-scales = "*"
r-tibble = "*"
r-vctrs = "*"
r-withr = "*"

[package.run-dependencies]
r-rcpp = "*"
r-cli = "*"
r-distributional = "*"
r-ggplot2 = "*"
r-glue = "*"
r-gtable = "*"
r-numderiv = "*"
r-quadprog = "*"
r-rlang = "*"
r-scales = "*"
r-tibble = "*"
r-vctrs = "*"
r-withr = "*"
