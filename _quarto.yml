project:
  type: book
  resources:
    - assets/js/version.js
    - assets/css/version.css

engine: knitr

book:
  title: "A2CPS Starter Kits"
  author: "A2CPS Consortium"
  date: today
  repo-url: https://github.com/a2cps/starterkits
  reader-mode: true
  search: true
  google-analytics: G-K3383Z78V7
  navbar:
    right:
      # Placeholder. assets/js/version.js replaces the menu contents at runtime,
      # using the v.json manifest published at the root of the site.
      - text: "Version"
        menu:
          - text: "empty"
  chapters:
    - index.qmd
    - Psychosocial_starter_kit.qmd
    - genetic_variants.qmd
    - genomic_imputation.qmd
    - mri-idps.qmd
    - raw-mri.qmd
    - brainager.qmd
    - fslanat.qmd
    - cat12.qmd
    - freesurfer.qmd
    - fmriprep.qmd
    - qsiprep.qmd
    - eddyqc.qmd
    - reconstruction.qmd
    - postdtifit.qmd
    - bedpostx.qmd
    - dwi_biomarker1.qmd
    - fcn.qmd
    - gift.qmd
    - postgift.qmd
    - mriqc.qmd
    - neural-pain-signatures.qmd
    - mri-derivative-qc.qmd
    - faq.qmd
    - references.qmd
  appendices:
    - bids-qc-joining.qmd
    - ids.qmd
    - nda-mri.qmd
    - mri-harmonization.qmd
    - psycho_social_biomarker_impute.qmd
    - biospecimenCRF_quality_checks_and_reformat.qmd
    - FuntionalCRF_data_quality_checks_and_reformat.qmd
    - ImagingCRF_data_quality_checks_and_reformat.qmd
    - QSTCRF_data_quality_checks_and_reformat.qmd

bibliography: bib/references.bib
csl: apa.csl
google-scholar: true

execute:
  freeze: auto  # re-render only when source changes
  cache: true
  warning: false
  message: false

format:
  html:
    theme: 
      light: cosmo
      dark: darkly
    df-print: kable
    citation-location: margin
    reference-location: margin
    css: assets/css/version.css
    include-in-header:
      text: |
        <script defer src="assets/js/version.js"></script>

