name: Publish

# The site is versioned: each build lands in its own directory on gh-pages.
#
#   main         -> dev/
#   tag vX.Y.Z   -> v/X_Y_Z/ (and, when newest, a copy at latest/)
#
# Rendering happens from the committed _freeze output, so no R is installed here.
# The site-wide pieces (manifest, redirects, latest/) are built by
# scripts/build-site-index.sh from the templates in assets/pages.
# See "Cutting a release" in contributing.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Both triggers write to gh-pages, so serialize them rather than racing.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine destination directory
        id: dest
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            echo "dir=v/${version//./_}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        uses: quarto-dev/quarto-actions/render@v2

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          # Only the contents of this directory are replaced; sibling versions survive.
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: false
          full_commit_message: "Publish ${{ steps.dest.outputs.dir }} from ${{ github.sha }}"

  # Rebuild the pieces that describe the site as a whole. Runs after every publish so
  # that latest/ re-derives itself from whatever versions actually exist.
  index:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site

      - name: Check out the script and page templates
        uses: actions/checkout@v7
        with:
          path: src
          sparse-checkout: |
            scripts
            assets/pages
          sparse-checkout-cone-mode: false

      - name: Rebuild manifest, redirects and latest/
        run: src/scripts/build-site-index.sh site src/assets/pages

      - name: Commit and push
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git commit -m "Update site index for ${{ github.sha }}"
          # This job checks out gh-pages after the build job has already pushed, and the
          # concurrency group keeps the two triggers from overlapping, so the branch is
          # current. A rejected push means that assumption broke: fail loudly.
          git push
