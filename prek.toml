#:schema https://www.schemastore.org/prek.json

[[repos]]
hooks = [ {id = "codespell"} ]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.2"

[[repos]]
hooks = [ {id = "panache-format"}, {id = "panache-lint"} ]
repo = "https://github.com/jolars/panache-pre-commit"
rev = "v2.43.1"

# Shortcodes are not expanded inside executable cells, where they would ship to the
# page as literal text. The render succeeds either way, so nothing else catches this.
[[repos]]
hooks = [
    {id = "check-var-shortcodes", entry = "python3 scripts/check_var_shortcodes.py", files = '\.qmd$', language = "system", name = "no {{< var >}} shortcodes in executable Quarto cells"},
]
repo = "local"
