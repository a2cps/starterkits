#:schema https://www.schemastore.org/prek.json

[[repos]]
hooks = [ {id = "codespell"} ]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"

# Keep rev in step with panache in pixi.toml. Panache 2.x indents grid tables, which
# pandoc then renders as a paragraph of dashes and pipes.
[[repos]]
hooks = [ {id = "panache-format"}, {id = "panache-lint"} ]
repo = "https://github.com/jolars/panache-pre-commit"
rev = "v3.0.2"

# Shortcodes are not expanded inside executable cells, where they would ship to the
# page as literal text. The render succeeds either way, so nothing else catches this.
[[repos]]
hooks = [
    {id = "check-var-shortcodes", entry = "python3 scripts/check_var_shortcodes.py", files = '\.qmd$', language = "system", name = "no {{< var >}} shortcodes in executable Quarto cells"},
]
repo = "local"

# Quarto copies everything in a chapter's local <name>_files/figure-html/ into _freeze,
# including figures from chunk labels since renamed. The page never shows them, so the
# render does not catch them either.
[[repos]]
hooks = [
    {id = "check-freeze-figures", entry = "python3 scripts/check_freeze_figures.py", files = '^_freeze/.+/(figure-html/[^/]+|execute-results/html\.json)$', language = "system", name = "no unused figures in _freeze", pass_filenames = false},
]
repo = "local"
